name: staging-orm-cutover-toggle

# 2026-09-29 ORM Slice 5/6 shadow validation: enable/disable ORM_WRITE_CUTOVER
# on STAGING (VM120) via the deploy runner (the only identity holding SSH access).
# One-shot operational toggle — NOT a general config service.

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'ORM_WRITE_CUTOVER value (1 = ORM paths, empty/0 = legacy psycopg2)'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  toggle:
    runs-on: [self-hosted, marion, llm-manager-deploy]
    steps:
      - name: Set ORM_WRITE_CUTOVER on staging + restart web
        run: |
          ssh llm-manager-deploy@10.0.20.131 "bash -s" <<REMOTE
          set -euo pipefail
          # systemd drop-in (the web unit has no EnvironmentFile; bootstrap
          # created drop-ins for env — match that mechanism)
          sudo mkdir -p /etc/systemd/system/llm-manager-web.service.d
          if [ -n "${{ github.event.inputs.value }}" ] && [ "${{ github.event.inputs.value }}" != "0" ]; then
            printf '[Service]\nEnvironment=ORM_WRITE_CUTOVER=%s\n' "${{ github.event.inputs.value }}" \
              | sudo tee /etc/systemd/system/llm-manager-web.service.d/orm-cutover.conf >/dev/null
            sudo mkdir -p /etc/systemd/system/llm-manager-recovery.service.d
            printf '[Service]\nEnvironment=ORM_WRITE_CUTOVER=%s\n' "${{ github.event.inputs.value }}" \
              | sudo tee /etc/systemd/system/llm-manager-recovery.service.d/orm-cutover.conf >/dev/null
          else
            sudo rm -f /etc/systemd/system/llm-manager-web.service.d/orm-cutover.conf \
                      /etc/systemd/system/llm-manager-recovery.service.d/orm-cutover.conf
          fi
          sudo systemctl daemon-reload
          sudo systemctl restart llm-manager-web llm-manager-recovery
          sleep 4
          systemctl is-active llm-manager-web llm-manager-recovery
          curl -sk https://127.0.0.1/healthz | head -c 120; echo
          systemctl show llm-manager-web -p Environment | tr ' ' '\n' | grep ORM_WRITE || echo "flag-absent"
          REMOTE