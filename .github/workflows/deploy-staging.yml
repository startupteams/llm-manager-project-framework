name: deploy-staging

# §11: staging CD — automatic after merge to main. Runs ONLY on the dedicated
# MARION self-hosted runner (never GitHub-hosted; never runs PR code).
# Trigger: successful ci.yml `artifact` job on main.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, marion, llm-manager-deploy]
    steps:
      - name: Checkout (workflow scripts run from the reviewed main tree)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve CI artifact SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download EXACT CI artifact (same SHA that passed CI — never rebuilt)
        uses: actions/github-script@v7
        with:
          script: |
            // Resolve the source CI run: workflow_run event, or (on manual
            // workflow_dispatch) the latest successful ci.yml run on main.
            let runId;
            if (context.payload.workflow_run) {
              runId = context.payload.workflow_run.id;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: "ci.yml", status: "success", head_branch: "main",
                per_page: 1,
              });
              if (!runs.data.workflow_runs.length) throw new Error("no successful ci.yml run on main");
              runId = runs.data.workflow_runs[0].id;
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: runId,
            });
            const art = artifacts.data.artifacts.find(a => a.name.startsWith("llm-manager-"));
            if (!art) throw new Error(`no llm-manager artifact on CI run ${runId}`);
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: art.id, archive_format: "zip",
            });
            const fs = require("fs");
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/artifact.zip`, Buffer.from(dl.data));

      - name: Unpack + checksum-verify artifact
        run: |
          # 2026-09-29 lesson: self-hosted runners reuse RUNNER_TEMP — a STALE
          # llm-manager-*.tar.gz from a previous deploy survived there and
          # `find | head -1` picked it (staging deployed 32a905e while main was
          # 8b05afb). Select by the EXACT resolved-SHA name and clear stale
          # tarballs first.
          cd "$RUNNER_TEMP"
          rm -f llm-manager-*.tar.gz llm-manager-*.tar.gz.sha256 artifact.zip
          unzip -o artifact.zip
          WANT="llm-manager-${{ steps.sha.outputs.sha }}.tar.gz"
          ART=$(find . -maxdepth 2 -name "$WANT" | head -1)
          [ -n "$ART" ] || { echo "artifact $WANT missing from CI run"; exit 1; }
          sha256sum -c "${ART}.sha256"
          echo "ARTIFACT=$(readlink -f "$ART")" >> "$GITHUB_ENV"

      - name: Transfer artifact to staging
        run: |
          # clear stale artifacts so the transaction can only pick THIS one
          ssh llm-manager-deploy@10.0.20.131 "rm -f /tmp/llm-manager-*.tar.gz /tmp/llm-manager-*.tar.gz.sha256"
          scp "$ARTIFACT" "$ARTIFACT.sha256" llm-manager-deploy@10.0.20.131:/tmp/

      - name: Preflight staging
        run: ssh llm-manager-deploy@10.0.20.131 "bash -s" < deploy/preflight.sh "/tmp/$(basename "$ARTIFACT")" --staging

      - name: Bootstrap (first deploy) or release-transaction deploy
        run: |
          ssh llm-manager-deploy@10.0.20.131 "bash -s" <<'REMOTE'
          set -euo pipefail
          ART=$(ls -t /tmp/llm-manager-*.tar.gz | head -1)
          if [ ! -e /opt/llm-manager/current ]; then
            sudo /opt/llm-manager-deploy/bootstrap-wrapper.sh "$ART" --staging
          else
            sudo /opt/llm-manager-deploy/deploy-wrapper.sh "$ART" --staging
          fi
          REMOTE

      - name: Post-deploy acceptance (healthcheck)
        run: ssh llm-manager-deploy@10.0.20.131 "sudo /opt/llm-manager-deploy/healthcheck-wrapper.sh --staging"

      - name: Record deployed SHA
        run: |
          ssh llm-manager-deploy@10.0.20.131 "cat /opt/llm-manager/current/release_manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"git_sha\"])'" > deployed-sha.txt
          echo "staging deployed at $(cat deployed-sha.txt)"
