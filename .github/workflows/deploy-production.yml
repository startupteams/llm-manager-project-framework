name: deploy-production

# §12: production CD — workflow_dispatch ONLY initially. GitHub Environment
# `production` requires a human reviewer. Deploys the SAME artifact/SHA that
# passed staging — the runner downloads the artifact, never rebuilds.

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Release git SHA to promote (must exist as an artifact)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    environment: production
    runs-on: [self-hosted, marion, llm-manager-deploy]
    steps:
      - name: Locate artifact for requested SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.inputs.git_sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "ci.yml", status: "success", head_branch: "main",
              per_page: 100,
            });
            for (const run of runs) {
              if (run.head_sha.startsWith(sha)) {
                const arts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
                });
                const art = arts.data.artifacts.find(a => a.name.startsWith("llm-manager-"));
                if (art) {
                  const dl = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner, repo: context.repo.repo,
                    artifact_id: art.id, archive_format: "zip",
                  });
                  const fs = require("fs");
                  fs.writeFileSync(`${process.env.RUNNER_TEMP}/artifact.zip`, Buffer.from(dl.data));
                  console.log(`using artifact from run ${run.id} (${run.head_sha})`);
                  return;
                }
              }
            }
            throw new Error(`no successful CI artifact found for sha ${sha}`);

      - name: Verify checksum
        run: |
          cd "$RUNNER_TEMP"
          unzip -o artifact.zip
          ART=$(find . -maxdepth 2 -name 'llm-manager-*.tar.gz' | head -1)
          sha256sum -c "${ART}.sha256"
          MAN_SHA=$(tar -xzOf "$ART" --wildcards '*/release_manifest.json' | python3 -c 'import json,sys;print(json.load(sys.stdin)["git_sha"])')
          echo "artifact git_sha: $MAN_SHA"
          case "$MAN_SHA" in "${{ inputs.git_sha }}"*) ;; *) echo "SHA MISMATCH"; exit 1;; esac
          echo "ARTIFACT=$ART" >> "$GITHUB_ENV"

      - name: Transfer to VM114
        run: scp "$ARTIFACT" "$ARTIFACT.sha256" llm-manager-deploy@10.0.20.108:/tmp/

      - name: Production release transaction (preflight → install → validate →
          migrate → activate → recovery-last restart → smoke → auto-rollback)
        run: |
          ssh llm-manager-deploy@10.0.20.108 "bash -s" <<'REMOTE'
          set -euo pipefail
          ART=$(ls /tmp/llm-manager-*.tar.gz | head -1)
          sudo /opt/llm-manager-deploy/deploy-wrapper.sh "$ART"
          REMOTE

      - name: Post-deploy acceptance
        run: ssh llm-manager-deploy@10.0.20.108 "sudo /opt/llm-manager-deploy/healthcheck-wrapper.sh"
