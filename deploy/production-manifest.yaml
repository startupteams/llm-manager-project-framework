# deploy/production-manifest.yaml
# Non-secret deployment manifest produced by the Phase 1 completeness audit
# (live VM114 capture 2026-09-27, files in llm-manager-cicd-20260927/capture/).
# Secret VALUES never appear here — only names, paths, and structural facts.

service: llm-manager
version_baseline: "0.11.0-default-baseline"
production_host:
  vm: VM114
  node: miam-00135
  ip: 10.0.20.108
  os: Ubuntu 24.04.4 LTS
  kernel: 6.8.0-139-generic
  python: "3.12.3"
  resources: {cpu: 8, ram_gb: 15, disk_gb: 61}

runtime:
  app_root: /opt/llm-manager          # flat layout today; releases/ + current/ going forward
  etc_root: /etc/llm-manager
  venv: /opt/llm-manager/venv         # 119 pinned packages == config/examples/requirements-v011-venv-freeze.txt
  log_dir: /var/log/llm-manager

components:
  - name: llm-manager-web
    kind: fastapi/uvicorn
    bind: 127.0.0.1:8001
    workers: 2
    source: service/app/main.py
  - name: litellm
    kind: litellm proxy
    bind: 127.0.0.1:4000
    config: /etc/llm-manager/litellm_config.yaml   # GENERATED by service/app/litellm_sync.py — never blind-overwrite (§15)
    env_file: /etc/llm-manager/litellm.env         # OPENROUTER_API_KEY (name only)
  - name: llm-manager-recovery
    kind: python service
    source: service/app/v011_recovery.py
    tick_seconds: 60
  - name: llm-manager-collector
    kind: python service
    source: service/collectors/gpu_power_collector.py
    env: {GPU_SAMPLE_SECONDS: 20}
  - name: llm-manager-emporia
    kind: python service
    source: service/collectors/emporia_adapter.py
  - name: agent-manager
    kind: fastapi/uvicorn
    bind: 127.0.0.1:8200
    source: /opt/agent-manager/main_am.py          # captured 2026-09-27 -> repo service/agentmanager/
    note: previously missing from repo; included in release artifact now
  - name: nginx
    kind: reverse proxy
    ports: [80, 443]
    site: ops/nginx/llm-manager
    tls: /etc/llm-manager/tls/{llm-manager.crt,llm-manager.key}   # external — operator-provisioned

external_dependencies:
  postgresql: {host: 10.0.20.116, databases: [llmmanager, litellm], user: llmmanager, kind: external}
  lldap: {host: 10.0.20.101, port: 3890, base: dc=example,dc=com, kind: external}
  proxmox_api: {host: 10.0.20.135, port: 8006, token: llm-manager@pve!manager-control, kind: external}
  emporia: {kind: cloud API, creds_file: /etc/llm-manager/secrets/emporia_creds}
  openrouter: {kind: cloud provider, env: OPENROUTER_API_KEY}

secret_files:   # NAMES ONLY — contract for bootstrap; values live only on the host
  - session_key
  - litellm_master_key
  - ldap_bind_dn
  - ldap_bind_pw
  - ldap_base_dn
  - pg_app_creds          # format: "PG_PW=<value>" line
  - pve_token
  - service_token
  - openrouter_api_key
  - emporia_creds
  - litellm_salt
  - agent_key_hermes_pilot
  - keys/                 # ssh key dir used by recovery remote ops

database:
  schema_reference: db/schema/schema.sql      # 33 tables incl. agentmanager schema
  migration_ledger: schema_migrations         # version, checksum, applied_at, git_sha
  baseline: "001 (empty DDL; live schema marked baseline)"
  pre_migration_backup: operator action, protected local copy, never uploaded

active_inference_hosts:   # as of 2026-09-27 (§21 corrected)
  - {name: "MIAM-00111 / VM102", ip: 10.0.20.168, vmid: 102, model: qwen3.8-flash-next, state: ACTIVE}
  - {name: "MIAM-00111 / VM103", ip: 10.0.20.161, vmid: 103, model: qwen3.8-27b, state: ROLLBACK-STOPPED-INTENTIONAL}
  - {name: "MIAM-00112 / VM401", ip: 10.0.20.162, vmid: 401, state: ACTIVE}
  - {name: "MIAM-00143 / VM109", ip: 10.0.20.163, vmid: 109, state: ACTIVE}
  - {name: "MIAM-00144 / VM111", ip: 10.0.20.164, vmid: 111, state: ACTIVE}
  - {name: "MIAM-00149 / VM149", ip: 10.0.20.165, vmid: 149, engine: llamacpp, state: ACTIVE}

completeness_table:
  fastapi_app: {in_repo: true, reproducible: true}
  recovery: {in_repo: true, reproducible: true}
  collectors: {in_repo: true, reproducible: true}
  pve_control: {in_repo: true, reproducible: true}
  agentmanager: {in_repo: "as of 2026-09-27 capture", reproducible: true}
  litellm: {in_repo: "sync script yes; captured yaml = reference", reproducible: "yes (regen from DB)"}
  nginx: {in_repo: true, reproducible: true}
  systemd_units: {in_repo: true, reproducible: true}
  db_schema: {in_repo: true, reproducible: "schema.sql + migrations ledger"}
  tls: {in_repo: false, reproducible: external}
  lldap: {in_repo: false, reproducible: external}
  postgresql: {in_repo: false, reproducible: external}
